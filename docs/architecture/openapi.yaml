    put:
      operationId: updateConfig
      summary: Initialize or append configuration after fresh auth
      description: Fresh auth <=5min, deliberate exact payee confirmation. Reject
        zero/wrong-format address. Does not mutate old quotes. Cannot change chain/token
        or enable mainnet. Secrets provisioned outside API. Policy content/URLs changing
        requires a new policy_version; a version never names different content.
        Published products must be versioned to the compatible policy before new
        checkouts are ready. Issued quotes retain their original policy/payee.
        ConfigUpdate.expected_config_version compares only the active
        merchant_config_versions.version, or zero exactly when control.config_id
        is NULL and no config versions exist. It never compares controls.version.
        Authenticate, require fresh auth, exact provisioned Origin/Host and CSRF
        even on replay; pay_origin in this body cannot establish an allowed origin.
        Local bootstrap provisions authentication and the trusted origin, not a
        merchant_config_versions row. Validate pay_origin against that independently
        provisioned public origin and confirmation_payee against the normalized payee.
        Under merchant_control lock, consult the command key/fingerprint FIRST.
        Equal fingerprint returns the original 200/body with Idempotency-Replayed=true,
        including after subsequent config/pause changes. Changed fingerprint returns
        409 IDEMPOTENCY_CONFLICT before comparing versions. For a new key, a stale
        expected_config_version returns 409 STALE_CONFIG with next_action=review_config;
        GET current config and explicitly reconfirm a new command. No rejected request
        inserts a config, audit success or command result. Inconsistent/orphaned config
        state returns 503 NOT_READY; never adopt or seed an existing version implicitly.
        For a valid new command, atomically insert immutable config version current+1,
        link control.config_id, increment the current control.version once, append
        operator audit and insert the completed command with original 200/OperatorConfig
        result referencing that audit. First save uses version 1, fixed Base/native-USDC
        values and finality_policy=safe; mainnet remains false, payments paused and
        physical disabled. Preserve fulfillment pause, caps and other controls.
        Later saves preserve finality_policy and all control fields except config_id
        and version. Pause/budget changes advance control.version independently and
        do not stale config writes; config saves stale older pause preconditions.
        No DB lock spans network I/O. Commit all four records/changes together or
        roll all back; lost/unknown commit response retries the identical key/body.
        Same-key races yield one mutation and replay; distinct keys with initial zero
        yield one version 1 and STALE_CONFIG for the loser. No order is required.
      security: *id016
      responses:
        '200':
          description: Success
          headers:
            Idempotency-Replayed:
              required: true
              description: True for a committed replay; never permits another wallet prompt.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/OperatorConfig'
                - properties:
                    state:
                      const: configured
        '400': *id003
        '401': *id011
        '403': *id012
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '503': *id008
        '500':
