    post:
      operationId: refundObservation
      summary: Record untrusted wallet outcome hint
      description: Hash is an untrusted hint. Confirmation additionally requires an operator-reported already-started wallet call associated with the immutable final authorization and a transfer strictly after its canonical anchor. No missing invocation or authorization is backfilled. accepts a hash from the original wallet-start version through later reconciliation versions because it supplies evidence, never renewed invocation authority. Rejection still requires the exact current invocation version. Worker independently verifies successful
