        '415':
          description: Unsupported content type; JSON required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id009
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Required with browser cookie authentication plus exact Origin;
          not needed for bearer-only agents. No cross-origin cookie fallback.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Random operation key. Reuse for retries; conflicting normalized
          fingerprint is 409. Durable financial records do not expire with a cache.
      - name: PAYMENT-SIGNATURE
        in: header
        required: false
        schema:
          type: string
          maxLength: 16384
        description: SDK-owned base64 PaymentPayload v2; decodePaymentSignatureHeader
          then upstream schema plus Dispatch quote/signature validation. Signature
          never grants order access.
        x-sdk-type: '@x402/core/types.PaymentPayload'
