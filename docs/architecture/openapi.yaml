      operationId: claimRefundInvocation
      summary: Reserve one-use wallet invocation ownership after exact binding review
      description: additional private guard. Reobserve the same unused pending-free nonce and canonical original/preparation anchors outside transactions; recheck bounded observation freshness, current fresh operator authority and the exact wallet-start version after the human confirmation wait. Insert a permanent unique refund and wallet-start invocation record before returning. This reserves ownership; the separate one-use authorization endpoint is the final sign_once authority after wallet reads. A lost response or duplicate fails closed; this endpoint never replays signing permission. It does not sign or send a transaction. Earlier wallet-start remains immutable and unknown outcomes never permit another invocation. A tested affirmative no-send retry uses its new wallet-start version on the same bound refund.
