        description: Required with browser cookie authentication plus exact Origin;
          not needed for bearer-only agents. No cross-origin cookie fallback.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Random operation key. Reuse for retries; conflicting normalized
          fingerprint is 409. Durable financial records do not expire with a cache.
  /v1/checkouts/{id}/pay:
    post:
      operationId: payCheckout
      summary: SDK challenge or durable payment command
      description: 'Authenticate before SDK parsing. No proof: 402 only for valid
        unpaid quote. Proof: bind exact authorization and enqueue before relay. Pending/paid
        retries never emit fresh 402. 202 is Dispatch commerce status, not an invented
        x402 pending envelope. Success header optional only when a real recorded SDK
        settlement response is independently corroborated. Proof-free 402 does not
        consume the financial idempotency record; the signed retry reuses the key,
        and only signed binding fixes payload digest. Recheck payment pause before
        every new settle call, including the bounded identical retry.'
      security: *id010
      responses:
        '202':
          description: Submission or fulfillment pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStatus'
          headers:
            Retry-After:
              schema:
                type: string
                pattern: ^[0-9]+$
            Location:
              schema:
                type: string
              description: Authenticated same-origin status path, no credential.
        '400': *id003
        '401': *id011
        '403': *id012
        '404': *id004
        '409': *id005
        '422': *id006
        '429': *id007
        '503': *id008
        '200':
          description: Existing verified payment/result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStatus'
          headers:
            PAYMENT-RESPONSE:
              schema:
                type: string
              description: Optional encodePaymentResponseHeader of real corroborated
                SDK SettleResponse; omitted if no upstream response exists.
        '402':
          description: Valid unpaid SDK challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDKPaymentRequired'
          headers:
            PAYMENT-REQUIRED:
              schema:
                type: string
              description: encodePaymentRequiredHeader(PaymentRequired), exact same
                challenge as body.
        '500':
          description: Redacted unexpected internal failure; never imply payment failed
            after unknown relay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '431':
          description: Header exceeds bounded size.
          content:
