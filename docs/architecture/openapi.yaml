  /v1/checkouts/{id}/quote:
    post:
      operationId: quoteCheckout
      summary: Authoritative immutable quote
      description: Confirmed grant required. No buyer amounts/payee accepted. New-payment
        pause, unknown tax or hidden physical prerequisites block. An unresolved attempt
        cannot be requoted. QuoteInput.policy_version must echo the version in
        CheckoutCreated or authenticated CheckoutStatus. Mismatch returns 409
        STALE_POLICY with next_action=review_policy; reread status and reconfirm.
        Under merchant_control then order locks, a draft with no issued quote whose
        bound policy differs from current config returns 409 STALE_POLICY with
        next_action=create_checkout. No quote, reservation or payment is created;
        explicitly abandon that unpaid draft and create/confirm a fresh checkout
        with a compatible published product, then review the newly returned policies.
        Issued quotes retain original policy URLs/version, payee and hash and are
        honored until their existing expiry, subject to pause/readiness guards.
        Requoting an expired unsubmitted order under a changed policy also requires
        a fresh checkout. Unresolved or paid attempts take precedence over stale-policy
        guidance and return existing status/conflict, never create_checkout or sign_once.
      security: *id010
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400': *id003
        '401': *id011
        '403': *id012
        '404': *id004
        '409':
          description: STALE_POLICY requires explicit policy review or a fresh unpaid
            checkout as described above; payment conflicts never invite another signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': *id006
        '429': *id007
        '503': *id008
