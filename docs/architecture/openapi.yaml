        RefundBinding.wallet_account_nonce, to=token, value=0 and exact calldata,
        plus the associated full original-payer Transfer. Inclusion height must be
        strictly greater than prepare_block and prepare_block_hash must still be
        canonical. Apply the saved order configuration observation policy; persist
        inclusion height/hash, log identity, observed head/policy and verifier evidence.
        Unknown-hash recovery scans complete canonical blocks after the saved anchor
        for the exact signer/nonce and verifies the same transaction/call/log binding;
        neither amount-only matching nor an old unrecorded transfer is evidence.
        Scan gaps, nonce drift, wrong payload, competing transaction or reorg remain
        review_required. Unknown broadcast forbids another prompt. user_rejected
        requires expected_version from that wallet-start response and bounded
        no_send_evidence carrying the same wallet_start_version. Under the refund
        lock reject a stale version/invocation before changing state. Only a tested
        allowlisted adapter rejection before signing, corroborated by independent
        canonical/unused/pending-free nonce checks and supported transport evidence,
        may establish no-send; no adapter is allowlisted until proves these
        semantics. Unsupported or uncorroborated claims remain review.
