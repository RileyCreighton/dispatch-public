      - payment_paused
      - fulfillment_paused
      - mainnet_enabled
      - physical_enabled
      - version
    OperatorConfig:
      type: object
      additionalProperties: false
      description: Private operator snapshot. config_version equals config.version when
        configured, otherwise zero; it is independent of controls.version. The server
        enforces this equality from one consistent DB snapshot, not JSON Schema alone.
        A PUT result is the original committed snapshot; GET reads current state.
      properties:
        state:
          type: string
          enum: [unconfigured, configured]
        config_version:
          type: integer
          minimum: 0
        config:
          oneOf:
          - $ref: '#/components/schemas/PublicConfig'
          - type: 'null'
        controls:
          $ref: '#/components/schemas/Controls'
      required: [state, config_version, config, controls]
      allOf:
      - if:
          properties:
            state:
              const: unconfigured
        then:
          properties:
            config_version:
              const: 0
            config:
              type: 'null'
            controls:
              properties:
                mainnet_enabled:
                  const: false
                payment_paused:
                  const: true
                physical_enabled:
                  const: false
        else:
          properties:
            config_version:
              type: integer
              minimum: 1
            config:
              $ref: '#/components/schemas/PublicConfig'
    PublicConfig:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: Immutable merchant_config_versions.version; equals the enclosing
            OperatorConfig.config_version. Version 1 is the first committed config.
        merchant_name:
          type: string
          maxLength: 160
        pay_origin: *id019
        payee:
          $ref: '#/components/schemas/Address'
        network:
          const: eip155:8453
        asset:
