      operationId: operatorConfig
      summary: Read configuration state and version preconditions
      description: Authenticated private-network read, including before first setup.
        Return OperatorConfig from one consistent DB snapshot of merchant_control
        and its linked immutable config. A clean migration returns state=unconfigured,
        config_version=0, config=null and controls.version=0, mainnet_enabled=false,
        payment_paused=true, fulfillment_paused=false, physical_enabled=false.
        Config version zero is a sentinel, never a stored configuration. Later control
        changes may advance controls.version while config_version stays zero.
        Operator authentication/bootstrap is independent of merchant configuration;
        missing config or provider readiness must not block this read or first save.
        No default payee/config is fabricated and GET has no initialization side effect.
