  /v1/checkouts/{id}:
    get:
      operationId: checkoutStatus
      summary: Private durable status; confirms grant possession
      description: Exact order grant required. Never lookup private status by tx hash.
        No automatic new quote/signature on pending or settled. Cache-Control private,
        no-store. Always return the order-bound policy_version and policy_urls, including
        draft status with no Quote. GET is passive and never changes the config binding.
      security: &id010
      - buyerBearer: []
      - buyerCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
