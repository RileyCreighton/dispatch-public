  /dispatch/v1/events:
    post:
      operationId: receivePaidEvent
      summary: Reference durable paid-order receiver
      description: HMAC-SHA256 over ASCII timestamp + period + exact raw body, key
        selected by key ID; constant-time compare; 300s freshness window. Stable effect_id
        across retries, fresh timestamp/signature. Transaction persists unique effect
        and resulting merchant-order receipt before ACK. HTTP 200 does not mean shipped.
        For paid events operation_id equals event_id; effect_id is stable logical
        effect identity. Status queries use event_id as operation_id.
