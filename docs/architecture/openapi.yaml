      - name: X-CSRF-Token
        in: header
        required: false
        schema: {type: string}
        description: Required when adding an order to an established browser cookie session.
      summary: Create unpaid order and recovery authority
      description: Rate-limited bootstrap. Browser requires exact Origin and JSON
        content type, gets Secure HttpOnly host-only cookie. Agent gets bearer once
        in body. No payment until successful authenticated status read confirms grant.
        Creation response loss may leave only an abandoned unpaid order. Return
        required policy_version and policy_urls from the saved orders.config_id,
        before any quote. Product policy_version must equal that config policy;
        incompatible publication blocks creation with NOT_READY. Policy URLs identify
        immutable versioned public policy content, never an operator-only resource.
      security: *id001
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutCreated'
          headers:
            Set-Cookie:
