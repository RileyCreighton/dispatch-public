  /v1/operator/refunds/{id}/wallet-start:
    post:
      operationId: refundWalletStart
      summary: Persist wallet-pending before external wallet call
      description: Only manual external EOA wallet; fresh auth and expected version
        required. A new wallet-start command is allowed only for an unbound prepared
        row or a bound rejected row satisfying the explicit retry guard; every other
        state conflicts, even with a new key. Independently observe chain 8453, a recent complete canonical block
        and hash, signer nonce at that block and pending nonce outside DB locks.
        Require unused nonce, no outstanding signer transaction, matching client hint
        and approved signer; stale/inconsistent observations fail closed. Under
        merchant_control then order/refund locks, check freshness and reserve the
        unique chain/signer/nonce. Persist immutable RefundBinding and wallet_pending
        together with command result/audit before returning. No network calls in locks.
        Client sends the returned nonce, token target, zero native value and exact
        transfer calldata; verify chain/account immediately before wallet invocation.
        Wallet overrides or ambiguity enter review, never allocate nonce+1.
        Only a first response with Idempotency-Replayed=false to an explicitly
        initiated command permits binding review only, with poll_status. The separate
        invocation endpoint reserves one-use ownership; the subsequent authorization endpoint is the sole source of sign_once authority after wallet reads. Persist client invocation intent
        before calling wallet. Replay, lost response, reload or uncertain invocation
        goes to status/reconciliation without another prompt. A bound rejected intent
        may be explicitly retried on the SAME row with fresh auth/new key/version
        only after durable affirmative no-send evidence and fresh independent checks
        that the original anchor is canonical and the same nonce remains unused
        with no pending transaction. Keep the original immutable binding; audit new
        readiness evidence and clear current no_send_evidence after archiving it in
        audit. Increment refund.version on every mutation, including wallet-start.
        A timeout/client assertion alone never proves no-send.
