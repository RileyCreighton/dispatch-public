openapi: 3.1.0
info:
  title: Dispatch v0.2 proposed application and reference adapter API
  version: 0.2.0
  description: 'Architecture contract only; no implemented server. SDK x402 envelope
    types remain upstream-owned. All private responses are Cache-Control: private,
    no-store. All errors are redacted Error objects. Browser cookie mutations require
    exact Origin and CSRF; operator routes are private-network only. Secret mounts
    and mainnet enablement have no HTTP API. Operator mutations with Idempotency-Key
    use operator_command_records keyed by single merchant, operationId and key hash,
    independent of buyer order scopes. Authenticate and check Origin/CSRF/current
    permissions on every replay. Under merchant_control lock, look up the normalized
    fingerprint (method, operationId, path IDs, body including its expected-version field)
    before stale-version checks. Equal fingerprint returns the original committed
    status/body; mismatch is 409 IDEMPOTENCY_CONFLICT. Commit mutation, audit and
    immutable command result together; no cache TTL deletion or dummy order.
    Idempotency-Replayed is required on successful keyed operator responses. A true
    value never authorizes another wallet prompt, even when the stored result says
    sign_once. Mutable current state is fetched separately. Reauth has no durable
    command key and verifies the password again on every call.'
servers:
- url: https://pay.dispatch.invalid
  description: Placeholder; no public deployment
