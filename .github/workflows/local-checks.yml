name: Local developer checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision pinned disposable developer tools
        run: |
          python3 scripts/install-local-tools.py "$RUNNER_TEMP/dispatch-tools"
          echo "$RUNNER_TEMP/dispatch-tools/node-v24.21.0-linux-x64/bin" >> "$GITHUB_PATH"
          echo "DISPATCH_TEST_PG_BIN=$RUNNER_TEMP/dispatch-tools/pg17/bin" >> "$GITHUB_ENV"
          echo "DISPATCH_SCHEMA_PYTHON=$RUNNER_TEMP/dispatch-tools/python/bin/python" >> "$GITHUB_ENV"
      - name: Locked install and compilation
        run: |
          npm ci --ignore-scripts
          npm ci --prefix tests/payment/tooling --ignore-scripts
          npm run build
          npm run build:web
          node node_modules/playwright/cli.js install chromium
      - name: Strict and portable source gates
        run: |
          npm run check
          npm run check:web
          npm run lint
          npm run format:check
          python3 scripts/test-foundation-topology.py
          python3 tests/hardening/security-evidence.test.py
          python3 scripts/validate-public.py
      - name: Real disposable integration and recovery
        run: python3 scripts/test-all.py
      - name: Native developer walkthrough and lifecycle
        run: python3 scripts/test-local-demo.py
      - name: Advisory check (failure remains failure)
        run: |
          npm audit --audit-level=high
          npm audit --prefix tests/payment/tooling --audit-level=high
      # No artifact upload, credentials, deployment, publication or live financial action.
      # Complete rootless-container and security qualification are separate review gates.
